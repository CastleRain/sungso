<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sungso</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 8px;
      font-size: 15px;
      color: #888;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 640px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 28px 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
    }

    .icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.3px;
    }

    .card-desc {
      font-size: 13.5px;
      color: #888;
      line-height: 1.6;
    }

    .card-arrow {
      margin-top: 6px;
      font-size: 13px;
      color: #bbb;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    footer {
      margin-top: 56px;
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sungso</h1>
    <p>개인 프로젝트 모음</p>
  </header>

  <div class="grid">

    <a class="card" href="./wecost/index.html">
      <div class="icon-wrap" style="background: #FFF0F3;">💍</div>
      <div class="card-body">
        <div class="card-title">WeCost</div>
        <div class="card-desc">결혼 준비 비용을 항목별로 정리하고<br>예산을 한눈에 파악하는 웨딩 가계부</div>
      </div>
      <div class="card-arrow">바로가기 →</div>
    </a>

    <a class="card" href="./honeymoon/index.html">
      <div class="icon-wrap" style="background: #F0F7FF;">🌴</div>
      <div class="card-body">
        <div class="card-title">Honeymoon</div>
        <div class="card-desc">몰디브 신혼여행 리조트 비교 및<br>패키지 정보를 정리한 플래너</div>
      </div>
      <div class="card-arrow">바로가기 →</div>
    </a>

  </div>

  <footer>sungso · 2026</footer>

</body>
</html>
