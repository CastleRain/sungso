<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성우 &amp; 소희</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    /* ── Flatpickr theme override ── */
    .flatpickr-calendar {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      border-radius: 20px !important;
      box-shadow: 0 8px 36px rgba(255,107,157,0.18) !important;
      border: 1.5px solid #FFECF3 !important;
      padding: 8px;
    }
    .flatpickr-months { padding: 4px 0 2px; }
    .flatpickr-month  { color: #333 !important; fill: #333 !important; }
    .flatpickr-current-month { font-size: 15px !important; font-weight: 700 !important; color: #333 !important; }
    .flatpickr-current-month select,
    .flatpickr-current-month input.cur-year { color: #333 !important; font-weight: 700; }
    .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: #ccc !important; }
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill: #FF6B9D !important; }
    .flatpickr-weekday { color: #ccc !important; font-weight: 600 !important; font-size: 12px !important; }
    .flatpickr-day {
      border-radius: 10px !important;
      font-size: 13px !important;
      color: #333 !important;
      border: none !important;
    }
    .flatpickr-day:hover { background: #FFF0F5 !important; color: #FF6B9D !important; }
    .flatpickr-day.today { border: 1.5px solid #FF6B9D !important; color: #FF6B9D !important; font-weight: 700; }
    .flatpickr-day.today:hover { background: #FFF0F5 !important; }
    .flatpickr-day.selected,
    .flatpickr-day.selected:hover {
      background: #FF6B9D !important;
      border-color: #FF6B9D !important;
      color: white !important;
      font-weight: 700;
    }
    .flatpickr-day.flatpickr-disabled { color: #e0e0e0 !important; }
    /* 월 드롭다운 글씨 깨짐 수정 */
    .flatpickr-monthDropdown-months {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif !important;
      font-size: 15px !important; font-weight: 700 !important; color: #333 !important;
      background: transparent; border: none; outline: none; cursor: pointer;
      -webkit-appearance: none; appearance: none; padding: 0;
    }
    .numInput.cur-year {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif !important;
      font-weight: 700 !important; color: #333 !important;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(160deg, #FFF5F7 0%, #FFF0EA 100%);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 140px;
    }

    /* ── Particles ── */
    .particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .particle {
      position: absolute; opacity: 0;
      animation: floatUp var(--dur) ease-in infinite var(--delay);
      left: var(--x); bottom: -20px;
      color: var(--color); font-size: var(--size);
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
      15%  { opacity: 0.65; }
      85%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-100vh) rotate(25deg); }
    }

    /* ── Layout ── */
    .main {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 64px 20px 40px; gap: 28px;
    }

    /* ── Header ── */
    header { text-align: center; }
    header h1 { font-size: 40px; font-weight: 800; color: #1a1a1a; letter-spacing: -2px; }
    .amp { color: #FF6B9D; }
    header .sub { margin-top: 10px; font-size: 15px; color: #bbb; }

    /* ── D-day ── */
    .dday-card {
      background: white; border-radius: 28px; padding: 32px 56px;
      text-align: center; box-shadow: 0 4px 28px rgba(255,107,157,0.13);
    }
    .dday-label { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #ccc; text-transform: uppercase; }
    .dday-number { font-size: 64px; font-weight: 900; color: #FF6B9D; letter-spacing: -3px; line-height: 1.1; margin: 8px 0 4px; }
    .dday-date { font-size: 13px; color: #ddd; }

    /* ── Project cards ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 14px; width: 100%; max-width: 560px; }
    .card {
      background: white; border-radius: 22px; padding: 24px;
      text-decoration: none; color: inherit;
      box-shadow: 0 2px 14px rgba(0,0,0,0.055);
      border: 2px solid transparent;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      display: flex; flex-direction: column; gap: 10px;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 32px rgba(255,107,157,0.12); border-color: #FFD0E4; }
    .icon-wrap { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; color: #FF85B3; background: #FFF0F6; padding: 3px 10px; border-radius: 20px; }
    .card-title { font-size: 16px; font-weight: 700; color: #111; margin-top: 8px; }
    .card-desc { font-size: 13px; color: #aaa; line-height: 1.65; }
    .card-cta {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #FFF8FA; border-radius: 14px; margin-top: 4px;
      transition: background 0.18s;
    }
    .card:hover .card-cta { background: #FFE8F2; }
    .card-cta-text { font-size: 13px; font-weight: 600; color: #FF85B3; }
    .card-cta-arrow { font-size: 15px; color: #FF85B3; transition: transform 0.18s; }
    .card:hover .card-cta-arrow { transform: translateX(5px); }

    /* ── Events section ── */
    .events-wrap { width: 100%; max-width: 560px; }
    .section-label { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #ccc; text-transform: uppercase; margin-bottom: 14px; }

    /* ── View tabs ── */
    .view-tabs { display: flex; background: #F8F0F4; border-radius: 12px; padding: 3px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 8px 0; border: none; background: transparent;
      border-radius: 10px; font-size: 13px; font-weight: 600; color: #ccc;
      cursor: pointer; transition: all 0.18s; font-family: inherit;
    }
    .tab-btn.active { background: white; color: #FF6B9D; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }

    /* ── List view ── */
    #listView { display: block; }
    #listView.hidden { display: none; }
    .event-list { display: flex; flex-direction: column; gap: 8px; }
    .event-row {
      background: white; border-radius: 16px; padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.04);
      cursor: pointer; border: 1.5px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .event-row:hover { background: #FDFAFA; }
    .event-row.past  { opacity: 0.35; }
    .event-row.next  { border-color: #FFCCE0; box-shadow: 0 4px 18px rgba(255,107,157,0.1); }
    .event-row.active-sel { border-color: #FF85B3 !important; background: #FFF5F8 !important; box-shadow: 0 4px 18px rgba(255,107,157,0.15) !important; }
    .ev-emoji { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
    .ev-info  { flex: 1; min-width: 0; }
    .ev-title { font-size: 14px; font-weight: 600; color: #333; }
    .ev-date  { font-size: 12px; color: #ccc; margin-top: 2px; }
    .ev-dday  { font-size: 12px; font-weight: 700; color: #FF6B9D; flex-shrink: 0; }
    .event-row.past .ev-dday { color: #ccc; }
    .ev-delete {
      opacity: 0; border: none; background: none; font-size: 14px;
      cursor: pointer; color: #ddd; padding: 4px 6px; border-radius: 8px;
      transition: all 0.15s; flex-shrink: 0;
    }
    .event-row:hover .ev-delete { opacity: 1; }
    .ev-delete:hover { color: #FF6B9D; background: #FFF0F5; }

    /* ── Add form ── */
    .add-btn {
      width: 100%; margin-top: 10px;
      padding: 13px; border: 2px dashed #FFD0E0; border-radius: 16px;
      background: transparent; color: #FFB3CC; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.18s; font-family: inherit;
    }
    .add-btn:hover { border-color: #FF6B9D; color: #FF6B9D; background: #FFF8FA; }
    .add-form {
      display: none; background: white; border-radius: 18px;
      padding: 18px; margin-top: 10px;
      box-shadow: 0 4px 20px rgba(255,107,157,0.1);
      border: 1.5px solid #FFECF3;
    }
    .add-form.show { display: block; }
    .form-label { font-size: 11px; font-weight: 700; color: #ccc; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
    .emoji-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .emoji-pick-btn {
      width: 38px; height: 38px; border: 2px solid #f0f0f0; border-radius: 10px;
      background: white; font-size: 18px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .emoji-pick-btn.selected { border-color: #FF6B9D; background: #FFF0F6; }
    .form-row { display: flex; gap: 8px; align-items: center; }
    .form-input {
      flex: 1; padding: 10px 14px; border: 1.5px solid #f0f0f0;
      border-radius: 12px; font-size: 14px; outline: none;
      transition: border-color 0.15s; font-family: inherit; color: #333;
    }
    .form-input:focus { border-color: #FF6B9D; }
    #formDate { flex: 0 0 auto; min-width: 130px; cursor: pointer; }
    .form-submit {
      padding: 10px 18px; background: #FF6B9D; color: white;
      border: none; border-radius: 12px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s; white-space: nowrap; font-family: inherit;
    }
    .form-submit:hover { background: #FF4081; }

    /* ── Calendar view ── */
    #calView { display: none; }
    #calView.show { display: block; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-nav {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: white; font-size: 18px; cursor: pointer; color: #bbb;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07); transition: color 0.15s;
    }
    .cal-nav:hover { color: #FF6B9D; }
    .cal-month-label { font-size: 15px; font-weight: 700; color: #333; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-day-name { text-align: center; font-size: 11px; font-weight: 600; color: #ccc; padding: 4px 0 8px; }
    .cal-cell {
      position: relative; text-align: center; padding: 6px 2px 8px;
      border-radius: 10px; min-height: 46px;
    }
    .cal-cell.other-month { opacity: 0.25; }
    .cal-cell.has-event { cursor: pointer; }
    .cal-cell.has-event:hover { background: #FFF5F8; }
    .cal-cell.selected { background: #FFF0F6; }
    .cal-date { font-size: 13px; color: #333; font-weight: 500; line-height: 26px; }
    .cal-cell.today .cal-date {
      background: #FF6B9D; color: white; border-radius: 50%;
      width: 26px; height: 26px; line-height: 26px; margin: 0 auto;
    }
    .cal-dots { display: flex; justify-content: center; gap: 3px; margin-top: 4px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: #FF6B9D; }

    /* Date popup */
    .cal-popup {
      display: none; margin-top: 12px; background: white;
      border-radius: 14px; padding: 14px 18px;
      box-shadow: 0 4px 18px rgba(255,107,157,0.1);
      border: 1.5px solid #FFCCE0;
    }
    .cal-popup.show { display: block; }
    .cal-popup-title { font-size: 12px; font-weight: 700; color: #FF6B9D; margin-bottom: 10px; letter-spacing: 0.3px; }
    .cal-popup-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; color: #333; border-top: 1px solid #fafafa; }
    .cal-popup-item:first-of-type { border-top: none; }

    footer { font-size: 13px; color: #ddd; text-align: center; }

    /* ── Characters ── */
    .scene {
      position: fixed; bottom: 0; left: 0;
      width: 100%; height: 115px;
      pointer-events: none; z-index: 20; overflow: hidden;
    }
    .char-h-boy  { position: absolute; bottom: 0; animation: moveRight 30s linear infinite; }
    .char-h-girl { position: absolute; bottom: 0; animation: moveLeft  24s linear infinite; }
    .char-bob       { animation: bob 0.45s ease-in-out alternate infinite; }
    .char-bob-delay { animation: bob 0.45s ease-in-out alternate infinite 0.22s; }
    @keyframes moveRight { from { transform: translateX(-100px); } to { transform: translateX(calc(100vw + 100px)); } }
    @keyframes moveLeft  { from { transform: translateX(calc(100vw + 100px)); } to { transform: translateX(-100px); } }
    @keyframes bob { from { transform: translateY(0px); } to { transform: translateY(-7px); } }

    @media (max-width: 480px) {
      header h1    { font-size: 32px; }
      .dday-number { font-size: 52px; }
      .dday-card   { padding: 26px 36px; }
      .form-row    { flex-wrap: wrap; }
      #formDate { flex: 1 1 100%; }
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="main">
  <header>
    <h1>성우 <span class="amp">♥</span> 소희</h1>
    <div class="sub">우리의 결혼 준비 공간 💕</div>
  </header>

  <div class="dday-card">
    <div class="dday-label" id="ddayLabel">결혼식까지</div>
    <div class="dday-number" id="ddayNum">—</div>
    <div class="dday-date" id="ddayDate">2027년 3월 6일 토요일</div>
  </div>

  <div class="grid">
    <a class="card" href="./wecost/index.html">
      <div class="icon-wrap" style="background:#FFF0F5;">💍</div>
      <div>
        <span class="badge">웨딩 가계부</span>
        <div class="card-title">WeCost</div>
        <div class="card-desc">결혼 준비 비용을 항목별로 정리하고<br>예산을 한눈에 파악해요</div>
      </div>
      <div class="card-cta"><span class="card-cta-text">방문하기</span><span class="card-cta-arrow">→</span></div>
    </a>
    <a class="card" href="./honeymoon/index.html">
      <div class="icon-wrap" style="background:#F0F8FF;">🌴</div>
      <div>
        <span class="badge">신혼여행 플래너</span>
        <div class="card-title">Honeymoon</div>
        <div class="card-desc">몰디브 리조트 비교 및<br>패키지 정보를 정리한 플래너</div>
      </div>
      <div class="card-cta"><span class="card-cta-text">방문하기</span><span class="card-cta-arrow">→</span></div>
    </a>
  </div>

  <!-- Events -->
  <div class="events-wrap">
    <div class="section-label">일정</div>

    <div class="view-tabs">
      <button class="tab-btn active" id="tabList">리스트</button>
      <button class="tab-btn" id="tabCal">달력</button>
    </div>

    <!-- List view -->
    <div id="listView">
      <div class="event-list" id="eventList">
        <div style="text-align:center;padding:28px;color:#ddd;font-size:13px;">불러오는 중...</div>
      </div>
      <button class="add-btn" id="addBtn">+ 일정 추가</button>
      <div class="add-form" id="addForm">
        <div class="form-label">이모지</div>
        <div class="emoji-picker" id="emojiPicker"></div>
        <div class="form-row">
          <input type="text" class="form-input" id="formTitle" placeholder="일정 제목 입력">
          <input type="text" class="form-input" id="formDate" placeholder="날짜 선택" readonly>
          <button class="form-submit" id="formSubmit">추가</button>
        </div>
      </div>
    </div>

    <!-- Calendar view -->
    <div id="calView">
      <div class="cal-header">
        <button class="cal-nav" id="calPrev">‹</button>
        <div class="cal-month-label" id="calMonthLabel"></div>
        <button class="cal-nav" id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-popup" id="calPopup"></div>
    </div>
  </div>

  <footer>성우 ♥ 소희 · 2027</footer>
</div>

<!-- Characters -->

        <ellipse cx="24" cy="95" rx="9" ry="5" fill="#FF4081"/>
        <ellipse cx="38" cy="95" rx="9" ry="5" fill="#FF4081"/>
      </svg>
    </div>

<!-- Particles + D-day (non-module) -->
<script>
  // Particles
  (function () {
    const c = document.getElementById('particles');
    const sym = ['♥','♡','✦','✧','❋','✿'];
    const col = ['#FF6B9D','#FFB3CC','#FF85B3','#FFD0E4','#FF4081'];
    for (let i = 0; i < 16; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = sym[i % sym.length];
      el.style.setProperty('--x',     (Math.random() * 100) + '%');
      el.style.setProperty('--dur',   (7 + Math.random() * 9) + 's');
      el.style.setProperty('--delay', '-' + (Math.random() * 14) + 's');
      el.style.setProperty('--color', col[Math.floor(Math.random() * col.length)]);
      el.style.setProperty('--size',  (10 + Math.random() * 11) + 'px');
      c.appendChild(el);
    }
  })();

  // Flatpickr date picker
  flatpickr('#formDate', {
    locale: 'ko',
    dateFormat: 'Y-m-d',
    minDate: 'today',
    disableMobile: true,
  });

  // D-day
  (function () {
    const wedding = new Date('2027-03-06T00:00:00');
    const today   = new Date(); today.setHours(0,0,0,0);
    const diff    = Math.ceil((wedding - today) / 86400000);
    const el      = document.getElementById('ddayNum');
    if      (diff > 0)  el.textContent = 'D-' + diff;
    else if (diff === 0) el.textContent = 'D-Day 💒';
    else                 el.textContent = 'D+' + Math.abs(diff);
  })();
</script>

<!-- Firebase (module) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    onSnapshot, query, orderBy, serverTimestamp, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey:            "AIzaSyBz-P5ycMAjYZBV7hkcZDrmq28EAw7Hsp8",
    authDomain:        "sungso-358cb.firebaseapp.com",
    projectId:         "sungso-358cb",
    storageBucket:     "sungso-358cb.firebasestorage.app",
    messagingSenderId: "143797950443",
    appId:             "1:143797950443:web:95b0f616246d84aae3bae"
  });
  const db = getFirestore(app);
  const eventsCol = collection(db, 'events');

  // ── State ──
  let allEvents      = [];
  let activeTab      = 'list';
  let calDate        = new Date();
  let selectedDate   = null;
  let selectedEmoji  = '📅';
  let selectedEvId   = null;   // 선택된 일정 id

  // ── D-day card update / reset ──
  function updateDdayCard(ev) {
    const diffMs  = new Date(ev.date + 'T00:00:00') - new Date(TODAY + 'T00:00:00');
    const diff    = Math.round(diffMs / 86400000);
    const ddayStr = diff > 0 ? 'D-' + diff : diff === 0 ? 'D-Day! 🎉' : 'D+' + Math.abs(diff);
    const dateStr = new Date(ev.date + 'T00:00:00').toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
    document.getElementById('ddayLabel').textContent = ev.emoji + ' ' + ev.title + '까지';
    document.getElementById('ddayNum').textContent   = ddayStr;
    document.getElementById('ddayDate').textContent  = dateStr;
  }
  function resetDdayCard() {
    const diff = Math.ceil((new Date('2027-03-06T00:00:00') - new Date(TODAY + 'T00:00:00')) / 86400000);
    document.getElementById('ddayLabel').textContent = '결혼식까지';
    document.getElementById('ddayNum').textContent   = diff > 0 ? 'D-' + diff : diff === 0 ? 'D-Day 💒' : 'D+' + Math.abs(diff);
    document.getElementById('ddayDate').textContent  = '2027년 3월 6일 토요일';
  }

  // Today string (local time, YYYY-MM-DD)
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  const TODAY = todayStr();

  // ── Seed initial data if collection is empty ──
  const SEED = [
    { date: '2026-09-13', title: '웨딩 촬영',      emoji: '📸' },
    { date: '2026-10-01', title: '청첩장 제작',     emoji: '✉️' },
    { date: '2026-11-01', title: '청첩장 발송',     emoji: '📬' },
    { date: '2026-12-15', title: '드레스 최종 피팅', emoji: '👗' },
    { date: '2027-01-20', title: '신혼집 계약',     emoji: '🏠' },
    { date: '2027-02-15', title: '혼수 준비 완료',  emoji: '🛍️' },
    { date: '2027-03-06', title: '결혼식',          emoji: '💒' },
    { date: '2027-03-10', title: '신혼여행 출발',   emoji: '✈️' },
  ];
  (async () => {
    const snap = await getDocs(eventsCol);
    if (snap.empty) {
      for (const ev of SEED) {
        await addDoc(eventsCol, { ...ev, createdAt: serverTimestamp() });
      }
    }
  })();

  // ── Real-time subscription ──
  onSnapshot(query(eventsCol, orderBy('date')), snap => {
    allEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (activeTab === 'list') renderList();
    else renderCalendar();
  });

  // ── List rendering ──
  function renderList() {
    const listEl = document.getElementById('eventList');
    if (!listEl) return;

    if (allEvents.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;padding:28px;color:#ddd;font-size:13px;">아직 일정이 없어요</div>';
      return;
    }

    const nextIdx = allEvents.findIndex(e => e.date >= TODAY);
    listEl.innerHTML = '';

    allEvents.forEach((ev, i) => {
      const isPast  = ev.date < TODAY;
      const isNext  = i === nextIdx;
      const diffMs  = new Date(ev.date + 'T00:00:00') - new Date(TODAY + 'T00:00:00');
      const diff    = Math.round(diffMs / 86400000);
      const ddayStr = isPast ? '완료 ✓' : diff === 0 ? 'D-Day! 🎉' : 'D-' + diff;
      const dateStr = new Date(ev.date + 'T00:00:00').toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });

      const isSel = ev.id === selectedEvId;
      const row = document.createElement('div');
      row.className = 'event-row' +
        (isPast  ? ' past'       : '') +
        (isNext  ? ' next'       : '') +
        (isSel   ? ' active-sel' : '');
      row.innerHTML =
        '<div class="ev-emoji">' + ev.emoji + '</div>' +
        '<div class="ev-info">' +
          '<div class="ev-title">' + ev.title + '</div>' +
          '<div class="ev-date">'  + dateStr  + '</div>' +
        '</div>' +
        '<div class="ev-dday">' + ddayStr + '</div>' +
        '<button class="ev-delete" title="삭제">🗑️</button>';

      row.querySelector('.ev-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteDoc(doc(db, 'events', ev.id));
        if (selectedEvId === ev.id) { selectedEvId = null; resetDdayCard(); }
      });
      row.addEventListener('click', (e) => {
        if (e.target.closest('.ev-delete')) return;
        if (selectedEvId === ev.id) { selectedEvId = null; resetDdayCard(); }
        else { selectedEvId = ev.id; updateDdayCard(ev); }
        renderList();
      });
      listEl.appendChild(row);
    });
  }

  // ── Calendar rendering ──
  const DAY_NAMES = ['일','월','화','수','목','금','토'];

  function renderCalendar() {
    const gridEl = document.getElementById('calGrid');
    if (!gridEl) return;

    const y = calDate.getFullYear();
    const m = calDate.getMonth();
    document.getElementById('calMonthLabel').textContent = y + '년 ' + (m + 1) + '월';

    // Build date → events map
    const evMap = {};
    allEvents.forEach(ev => {
      (evMap[ev.date] = evMap[ev.date] || []).push(ev);
    });

    const firstDay    = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();

    let html = DAY_NAMES.map(n => `<div class="cal-day-name">${n}</div>`).join('');

    // Leading empty cells
    for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell other-month"></div>';

    for (let d = 1; d <= daysInMonth; d++) {
      const ds  = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const evs = evMap[ds] || [];
      const isToday    = ds === TODAY;
      const isSelected = ds === selectedDate;
      const hasEvent   = evs.length > 0;

      let cls = 'cal-cell';
      if (isToday)    cls += ' today';
      if (hasEvent)   cls += ' has-event';
      if (isSelected) cls += ' selected';

      const dots = evs.slice(0, 3).map(() => '<div class="cal-dot"></div>').join('');

      html += `<div class="${cls}" data-date="${ds}">
        <div class="cal-date">${d}</div>
        ${dots ? '<div class="cal-dots">' + dots + '</div>' : ''}
      </div>`;
    }

    gridEl.innerHTML = html;

    gridEl.querySelectorAll('.cal-cell.has-event').forEach(cell => {
      cell.addEventListener('click', () => {
        selectedDate = cell.dataset.date;
        renderCalendar();
        showCalPopup(evMap[selectedDate] || []);
      });
    });

    // Keep popup visible if date is still selected
    if (selectedDate && evMap[selectedDate]) showCalPopup(evMap[selectedDate]);
    else if (selectedDate && !evMap[selectedDate]) document.getElementById('calPopup').classList.remove('show');
  }

  function showCalPopup(events) {
    const popup = document.getElementById('calPopup');
    if (!popup) return;
    const dateStr = new Date(selectedDate + 'T00:00:00').toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
    popup.innerHTML =
      '<div class="cal-popup-title">' + dateStr + '</div>' +
      events.map(ev =>
        '<div class="cal-popup-item"><span>' + ev.emoji + '</span><span>' + ev.title + '</span></div>'
      ).join('');
    popup.classList.add('show');
  }

  // ── Tab switching ──
  document.getElementById('tabList').addEventListener('click', () => {
    activeTab = 'list';
    document.getElementById('tabList').classList.add('active');
    document.getElementById('tabCal').classList.remove('active');
    document.getElementById('listView').classList.remove('hidden');
    document.getElementById('calView').classList.remove('show');
    renderList();
  });

  document.getElementById('tabCal').addEventListener('click', () => {
    activeTab = 'calendar';
    document.getElementById('tabCal').classList.add('active');
    document.getElementById('tabList').classList.remove('active');
    document.getElementById('calView').classList.add('show');
    document.getElementById('listView').classList.add('hidden');
    renderCalendar();
  });

  // ── Calendar navigation ──
  document.getElementById('calPrev').addEventListener('click', () => {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1);
    selectedDate = null;
    document.getElementById('calPopup').classList.remove('show');
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1);
    selectedDate = null;
    document.getElementById('calPopup').classList.remove('show');
    renderCalendar();
  });

  // ── Add form ──
  const QUICK_EMOJIS = ['📸','💍','✉️','📬','👗','🏠','🛍️','💒','✈️','📅','🎉','💕'];

  (function initEmojiPicker() {
    const picker = document.getElementById('emojiPicker');
    QUICK_EMOJIS.forEach(em => {
      const btn = document.createElement('button');
      btn.className = 'emoji-pick-btn' + (em === selectedEmoji ? ' selected' : '');
      btn.textContent = em;
      btn.type = 'button';
      btn.addEventListener('click', () => {
        selectedEmoji = em;
        picker.querySelectorAll('.emoji-pick-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      picker.appendChild(btn);
    });
  })();

  document.getElementById('addBtn').addEventListener('click', () => {
    document.getElementById('addForm').classList.toggle('show');
  });

  document.getElementById('formSubmit').addEventListener('click', async () => {
    const title = document.getElementById('formTitle').value.trim();
    const date  = document.getElementById('formDate').value;
    if (!title || !date) return;

    await addDoc(eventsCol, { title, date, emoji: selectedEmoji, createdAt: serverTimestamp() });

    document.getElementById('formTitle').value = '';
    document.getElementById('formDate').value  = '';
    document.getElementById('addForm').classList.remove('show');
  });
</script>

</body>
</html>
