name: Update HomeHunt legal district codes

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: homehunt-law-districts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate official legal district codes
        shell: pwsh
        run: ./services/homehunt/scripts/update-law-districts.ps1
      - name: Commit refreshed district mapping
        id: publish_data
        shell: bash
        run: |
          if git diff --quiet -- apps/homehunt/data/law-districts.json; then
            echo "No district-code changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/homehunt/data/law-districts.json
          git commit -m "data: refresh homehunt law districts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the updated site through the Pages artifact workflow
        if: steps.publish_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
