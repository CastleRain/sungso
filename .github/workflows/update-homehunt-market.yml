name: Update HomeHunt market data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 17 * * *"

permissions:
  contents: write

concurrency:
  group: homehunt-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch and aggregate MOLIT transactions
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: node homehunt/scripts/fetch-market-data.mjs
      - name: Commit refreshed public aggregates
        run: |
          if git diff --quiet -- homehunt/data; then
            echo "No market-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homehunt/data/market-summary.json homehunt/data/apartment-history.json
          git commit -m "data: refresh homehunt market cache"
          git push
