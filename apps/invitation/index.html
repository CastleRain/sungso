<body data-app="invitation"><div data-private-root hidden inert>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="app-topbar">
    <a class="brand" href="../" aria-label="sungso 홈으로"><img class="sungso-wordmark" src="../shared/theme/sungso-wordmark-sky.png" alt="sungso" width="2091" height="752"><span>OUR WEDDING NOTE</span></a>

  </header>
  <div class="connection-bar"><span id="sync-status" role="status">공동 선택 연결 중…</span><button data-action="retry" id="retry" hidden>다시 연결</button></div>
  <main id="main" tabindex="-1"><p class="initial-loading">우리의 청첩장을 펼치는 중…</p></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="profile-dialog" class="profile-dialog" aria-labelledby="profile-title"><header class="profile-editor-header"><div><p class="eyebrow">OUR INVITATION</p><h2 id="profile-title">사진과 예식장 설정</h2></div><button type="button" data-profile-action="close" aria-label="사진과 예식장 설정 닫기">×</button></header><div class="profile-editor-content"></div></dialog>
  <dialog id="actor-dialog" class="small-dialog" aria-labelledby="actor-title"><form method="dialog"><button class="dialog-close" aria-label="닫기">×</button></form><p class="eyebrow">PICKED WITH LOVE</p><h2 id="actor-title">누가 고르고 있나요?</h2><p>각자의 취향을 모아<br>우리의 청첩장을 함께 골라요.</p><div class="actor-choices"><button data-action="choose-actor" data-person="sungwoo">성우<span>의 취향</span></button><button data-action="choose-actor" data-person="sohee">소희<span>의 취향</span></button></div><small>이 기기에서 기억할게요. 언제든 바꿀 수 있어요.</small></dialog>
  <dialog id="options-dialog" class="options-dialog" aria-label="청첩장 꾸미기"><form method="dialog"><button class="dialog-close" aria-label="꾸미기 닫기">×</button></form><div id="mobile-options"></div><form method="dialog"><button class="button primary full-width">미리보기로 돌아가기</button></form></dialog>
  <dialog id="venue-map-dialog" class="venue-map-dialog" aria-label="오시는 길 약도 크게 보기"><form method="dialog"><button class="photo-close" aria-label="약도 닫기">×</button></form><img id="large-venue-map" alt=""><p id="venue-map-caption">오시는 길 약도</p></dialog>
  <dialog id="photo-dialog" class="photo-dialog" aria-label="사진 크게 보기"><form method="dialog"><button class="photo-close" aria-label="사진 닫기">×</button></form><img id="large-photo" alt=""><div class="photo-navigation"><button data-action="previous-photo" aria-label="이전 사진">←</button><span id="photo-count"></span><button data-action="next-photo" aria-label="다음 사진">→</button></div></dialog>
  <dialog id="compare-dialog" class="compare-dialog" aria-labelledby="compare-title"><form method="dialog"><button class="dialog-close" aria-label="비교 닫기">×</button></form><div id="compare-content"></div></dialog>
  <dialog id="conflict-dialog" class="small-dialog" aria-labelledby="conflict-title"><form method="dialog"><button class="dialog-close" aria-label="닫기">×</button></form><p class="eyebrow">OUR LATEST CHOICE</p><h2 id="conflict-title">함께 고른 내용이 바뀌었어요</h2><p>다른 기기에서 저장한 최신 선택을 확인해주세요. 지금 꾸민 내용은 임시로 유지할게요.</p><div id="latest-choice"></div><div class="conflict-actions"><button class="button secondary" data-action="view-latest">최신 선택 보기</button><button class="button primary" data-action="acknowledge-conflict">확인했어요 · 계속 꾸미기</button></div></dialog>
  <noscript><p>청첩장 예시와 공동 선택 기능을 사용하려면 JavaScript를 켜주세요.</p></noscript>
