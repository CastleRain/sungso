<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFDFF">
  <meta name="description" content="성우와 소희의 집 선택. 실제 가격, 통근, 자금과 검증된 전망을 함께 확인하세요.">
  <title>HomeHunt 2 · 우리의 다음 집</title>
  <link rel="stylesheet" href="../shared/theme/brand.css?v=sky-1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="../homehunt/css/map-markers.css">
  <link rel="stylesheet" href="./css/style.css?v=2.0.3">
  <style>[data-private-root][hidden]{display:none!important}</style>
  <script type="module" src="../shared/firebase/boot.mjs"></script>
</head>
<body class="homehunt-v2" data-app="homehunt-v2"><div data-private-root hidden inert>
  <a class="skip-link" href="#workspace">본문으로 이동</a>
  <aside class="sidebar">
    <a href="./" class="brand" aria-label="HomeHunt 2 판단 보드"><span class="brand-icon"><i class="ti ti-home-heart" aria-hidden="true"></i></span><span>HomeHunt<span class="brand-version">VER 2</span></span></a>
    <p class="sidebar-caption">OUR NEXT HOME</p>
    <nav id="navigation" aria-label="주 메뉴"></nav>
    <div class="sidebar-bottom"><a href="../homehunt/" class="version-link"><i class="ti ti-arrow-back-up" aria-hidden="true"></i> 기존 HomeHunt · Ver1</a><a href="../" class="version-link"><i class="ti ti-heart" aria-hidden="true"></i> 성우 & 소희 홈</a></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="page-context"><span id="pageEyebrow">OUR DECISION</span><h1 id="pageTitle">판단 보드</h1></div>
      <form class="global-search" id="globalSearch"><i class="ti ti-search" aria-hidden="true"></i><input id="globalQuery" aria-label="단지명·동네·주소 검색" placeholder="어느 동네, 어떤 아파트가 궁금한가요?" autocomplete="off"><button class="search-submit" aria-label="단지 검색" type="submit"><i class="ti ti-arrow-right" aria-hidden="true"></i></button></form>
      <div class="top-actions"><button id="accountButton" class="button quiet" aria-label="계정 연결과 기록 백업"><i class="ti ti-user-circle" aria-hidden="true"></i><span>계정 연결</span></button><button class="button primary" data-action="visit-new" aria-label="방문 기록 추가"><i class="ti ti-plus" aria-hidden="true"></i><span>방문 기록</span></button></div>
    </header>
    <div id="localAccessNotice" class="local-access" role="status" hidden></div>
    <main id="workspace" tabindex="-1">
      <section id="view-board" data-view="board"></section>
      <section id="view-find" data-view="find" hidden></section>
      <section id="view-records" data-view="records" hidden></section>
      <section id="view-market" data-view="market" hidden></section>
      <section id="view-supply" data-view="supply" hidden></section>
      <section id="view-model" data-view="model" hidden></section>
      <section id="view-guide" data-view="guide" hidden></section>
      <section id="view-connection" data-view="connection" hidden></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="boot-status" id="bootStatus" role="status"><span class="spinner"></span>공식 자료와 이 기기의 기록을 읽고 있어요</div>
  <noscript>HomeHunt는 지도와 집 탐색을 위해 JavaScript가 필요합니다.</noscript>
  <script type="application/x-sungso-script" data-src="./js/boot-status.js?v=2.0.3"></script>
  <script type="application/x-sungso-script" data-src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script type="application/x-sungso-script" data-src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ko.js"></script>
  <script type="application/x-sungso-script" data-src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script type="application/x-sungso-script" data-type="module" data-src="./js/app.js?v=2.0.3"></script>
</div></body>
</html>
