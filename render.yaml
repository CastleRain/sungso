services:
  - type: web
    name: sungso-homehunt-api
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: npm ci --include=dev --prefix services/homehunt/render && npm run build --prefix services/homehunt/render
    startCommand: npm start --prefix services/homehunt/render
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/homehunt/render/**
        - services/homehunt/server/**
        - services/homehunt/scripts/**
        - services/homehunt/paths.mjs
        - apps/homehunt/data/apartment-catalog-seoul-gyeonggi.json
        - shared/homehunt/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: sungso-358cb
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: HOMEHUNT_PROVIDER_CONFIG
        sync: false
